# Builds the Windows playtest exe on every push to living-ink and publishes it as the
# "playtest-latest" release (one rolling release, replaced each time).
# Download: the repo's Releases page, "Ostium playtest (latest)", Ostium.exe (or the zip).
name: Windows playtest build
 
on:
  push:
    branches: [living-ink]
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: playtest-build
  cancel-in-progress: true
 
env:
  GODOT_VERSION: "4.3"
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable
 
      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
 
      - name: Import assets
        run: |
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import || true
 
      - name: Export Windows build
        run: |
          mkdir -p dist
          ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" dist/Ostium.exe
          test -s dist/Ostium.exe
          cd dist && zip -q -9 Ostium_playtest.zip Ostium.exe && ls -la
 
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete playtest-latest --cleanup-tag --yes || true
          gh release create playtest-latest dist/Ostium.exe dist/Ostium_playtest.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Ostium playtest (latest)" \
            --notes "Built automatically from living-ink at ${GITHUB_SHA::8} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download Ostium.exe and run it (Ostium_playtest.zip has the same exe, for browsers that block .exe downloads). Debug mode: the 'Debug: unlock all' button on the doors screen."
 
